<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TopAI - by Ashish</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body{background:#212121; color:white; font-family: sans-serif;}
#messages::-webkit-scrollbar{width:0}
</style>
</head>
<body class="h-screen flex flex-col">

<!-- Header - ChatGPT jaisa -->
<div class="p-4 flex justify-between items-center border-b border-white/10">
<h1 class="font-bold text-xl">TopAI <span class="text-[10px] font-normal bg-white text-black px-2 py-1 rounded-full ml-2">Owner Ashish</span></h1>
<button onclick="clearChat()" class="text-sm text-gray-400"><i class="fa-regular fa-pen-to-square"></i> New Chat</button>
</div>

<!-- Middle - ChatGPT jaisa first page -->
<div id="messages" class="flex-1 overflow-y-auto p-4 max-w-3xl w-full mx-auto">
<div id="welcome" class="h-full flex flex-col items-center justify-center text-center mt-20">
<div class="w-14 h-14 bg-white rounded-full flex items-center justify-center mb-5"><i class="fa-solid fa-bolt text-black text-2xl"></i></div>
<h2 class="text-3xl font-bold">What can I help with?</h2>
<p class="text-gray-400 mt-3 text-sm">TopAI - Created by Ashish</p>
<div class="grid grid-cols-2 gap-3 mt-10 w-full max-w-lg">
<button onclick="setPrompt('Write a code for...')" class="p-4 bg-[#2f2f2f] rounded-xl text-left text-sm hover:bg-[#3a3a3a]">Write a code</button>
<button onclick="setPrompt('Explain in simple words...')" class="p-4 bg-[#2f2f2f] rounded-xl text-left text-sm hover:bg-[#3a3a3a]">Explain something</button>
<button onclick="setPrompt('Make a story about...')" class="p-4 bg-[#2f2f2f] rounded-xl text-left text-sm hover:bg-[#3a3a3a]">Make a story</button>
<button onclick="setPrompt('Give me ideas for...')" class="p-4 bg-[#2f2f2f] rounded-xl text-left text-sm hover:bg-[#3a3a3a]">Give me ideas</button>
</div>
</div>
</div>

<!-- Bottom Input - ChatGPT jaisa with Voice -->
<div class="p-4 bg-[#212121]">
<div class="max-w-3xl mx-auto">
<div class="bg-[#2f2f2f] rounded-[26px] p-2 flex items-end gap-2 border border-white/10">
<textarea id="userInput" rows="1" placeholder="Ask anything" class="flex-1 bg-transparent p-3 outline-none resize-none max-h-32 text-[16px]"></textarea>
<button onclick="startVoice()" id="micBtn" class="w-9 h-9 rounded-full bg-[#212121] flex items-center justify-center hover:bg-black"><i class="fa-solid fa-microphone"></i></button>
<button onclick="sendMessage()" class="w-9 h-9 rounded-full bg-white text-black flex items-center justify-center"><i class="fa-solid fa-arrow-up"></i></button>
</div>
<p class="text-[11px] text-center text-gray-500 mt-3">TopAI can make mistakes. Owner - Ashish</p>
</div>
</div>

<!-- Hidden Key Input - 1st time puchega -->
<div id="keyModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
<div class="bg-[#2f2f2f] p-6 rounded-2xl w-full max-w-sm">
<h3 class="font-bold">🔑 API Key daalo</h3>
<p class="text-xs text-gray-400 mt-1">1 baar hi puchhega. aistudio.google.com se key lo.</p>
<input id="apiKeyInput" type="text" placeholder="AQ. ya AIza... se start hogi" class="w-full mt-4 p-3 rounded-xl bg-black border border-white/10 outline-none">
<button onclick="saveKey()" class="w-full mt-3 bg-white text-black p-3 rounded-full font-bold">Save</button>
</div>
</div>

<script>
let API_KEY = localStorage.getItem("topai_key");
if(!API_KEY) document.getElementById("keyModal").classList.remove("hidden");

function saveKey(){
 let k = document.getElementById("apiKeyInput").value.trim();
 if(k.length < 20){ alert("Puri key paste karo"); return; }
 if(!k.startsWith("AIza") &&!k.startsWith("AQ.")){ alert("Ye key galat hai"); return; }
 localStorage.setItem("topai_key", k);
 document.getElementById("keyModal").classList.add("hidden");
}

function setPrompt(t){ document.getElementById("userInput").value = t; document.getElementById("userInput").focus(); }

function clearChat(){ document.getElementById("messages").innerHTML = document.getElementById("welcome").outerHTML; document.getElementById("welcome").classList.remove("hidden"); }

async function sendMessage(){
 let input = document.getElementById("userInput");
 let text = input.value.trim();
 if(!text) return;
 document.getElementById("welcome")?.classList.add("hidden");
 addMsg(text, "user");
 input.value = "";
 addMsg("...", "bot", true);

 try{
   let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${localStorage.getItem("topai_key")}`, {
     method:"POST", headers:{"Content-Type":"application/json"},
     body: JSON.stringify({contents:[{parts:[{text:text}]}]})
   });
   let data = await res.json();
   document.getElementById("temp")?.remove();
   if(data.error){ addMsg("Error: "+data.error.message, "bot"); return; }
   addMsg(data.candidates[0].content.parts[0].text, "bot");
 } catch(e){ document.getElementById("temp")?.remove(); addMsg("Error: "+e.message, "bot"); }
}

function addMsg(t, who, isTemp=false){
 let div = document.createElement("div");
 div.className = who==="user"? "bg-[#2f2f2f] p-4 rounded-2xl ml-auto max-w-[80%] mt-4 w-fit" : "p-4 mt-4 max-w-[95%] whitespace-pre-wrap leading-7";
 div.innerText = t;
 if(isTemp) div.id="temp";
 document.getElementById("messages").appendChild(div);
 document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
}

// Voice - ChatGPT jaisa
function startVoice(){
 let btn = document.getElementById("micBtn");
 if(!('webkitSpeechRecognition' in window)){ alert("Voice is browser me support nahi hai, Chrome use karo"); return; }
 let rec = new webkitSpeechRecognition();
 rec.lang = "hi-IN"; rec.start();
 btn.innerHTML = '<i class="fa-solid fa-stop text-red-500"></i>';
 rec.onresult = (e)=>{ document.getElementById("userInput").value = e.results[0][0].transcript; };
 rec.onend = ()=>{ btn.innerHTML = '<i class="fa-solid fa-microphone"></i>'; };
}

document.getElementById("userInput").addEventListener("keydown", e=>{ if(e.key==="Enter" &&!e.shiftKey){ e.preventDefault(); sendMessage(); }});
</script>
</body>
</html>
